<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Тест по JavaScript</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: липкая строка вкладок-тем сверху, под ней одна панель; в конце вкладка с сертификатом на «бумажной» карточке */
:root{
  --bg:#F2F5FB; --surface:#FFFFFF; --fg:#0F1B3D; --muted:#5B6787; --line:#D8DFEE;
  --accent:#2446D6; --accent-soft:#E3E9FC; --on-accent:#FFFFFF;
  --good:#17824F; --good-soft:#E1F3E9; --bad:#C0353A; --bad-soft:#FBE5E6;
  --paper:#FBFBF8; --paper-ink:#14224F; --paper-muted:#5E6786; --paper-gold:#A9822F; --paper-line:#DCD6C3;
  --font-display:'Unbounded','Manrope',system-ui,sans-serif;
  --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-cert:'Cormorant Garamond','Times New Roman',serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1126; --surface:#131B38; --fg:#E8ECFA; --muted:#9AA5C6; --line:#263156;
    --accent:#8197FF; --accent-soft:#1F2A58; --on-accent:#0B1126;
    --good:#4CC38A; --good-soft:#12342A; --bad:#F27E83; --bad-soft:#3B1D24;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1126; --surface:#131B38; --fg:#E8ECFA; --muted:#9AA5C6; --line:#263156;
  --accent:#8197FF; --accent-soft:#1F2A58; --on-accent:#0B1126;
  --good:#4CC38A; --good-soft:#12342A; --bad:#F27E83; --bad-soft:#3B1D24;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:16px; line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 56px;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg)}
.wrap{max-width:860px; margin:0 auto}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
h1,h2,h3{font-family:var(--font-display); margin:0; text-wrap:balance; letter-spacing:-.01em}

/* шапка */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px 20px; flex-wrap:wrap; padding-bottom:16px}
.brand{font-family:var(--font-display); font-weight:700; font-size:1.05rem}
.brand small{display:block; font-family:var(--font-body); font-weight:500; font-size:.78rem; color:var(--muted); letter-spacing:.02em}
.pill{display:flex; align-items:baseline; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:.85rem; color:var(--muted); font-variant-numeric:tabular-nums}
.pill b{font-family:var(--font-display); font-size:1.05rem; color:var(--fg)}
.bar{height:4px; background:var(--line); border-radius:4px; overflow:hidden}
.bar i{display:block; height:100%; width:0; background:var(--accent); transition:width .4s ease}

/* вкладки */
.tabs-wrap{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding-block:12px; border-bottom:1px solid var(--line)}
.tabs{display:flex; gap:6px; overflow-x:auto; scrollbar-width:thin}
.tab{flex:0 0 auto; display:flex; align-items:center; gap:8px; background:transparent; border:1px solid transparent; border-radius:10px; padding:8px 12px; font-weight:600; font-size:.92rem; color:var(--muted); white-space:nowrap}
.tab:hover{background:var(--accent-soft); color:var(--fg)}
.tab[aria-selected="true"]{background:var(--accent); color:var(--on-accent)}
.tab .meta{font-size:.74rem; font-weight:700; padding:1px 7px; border-radius:6px; background:var(--accent-soft); color:var(--accent); font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] .meta{background:rgba(255,255,255,.2); color:inherit}
.tab.done .meta{background:var(--good-soft); color:var(--good)}
.tab[aria-selected="true"].done .meta{background:rgba(255,255,255,.22); color:inherit}
.tab.locked{opacity:.65}

/* панель */
.panel{padding-top:24px; display:grid; gap:16px}
.panel.enter{animation:enter .28s ease both}
@keyframes enter{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
.eyebrow{margin:0 0 6px; font-size:.78rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent)}
.head h2{font-size:clamp(1.4rem,4.5vw,2rem); line-height:1.2}
.head p.note{margin:8px 0 0; color:var(--muted); max-width:60ch}

.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 20px; min-width:0}
.q-num{font-size:.78rem; font-weight:700; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; margin:0 0 6px}
.q-text{font-weight:700; font-size:1.08rem; margin:0 0 14px; text-wrap:pretty}
.opts{display:grid; gap:8px}
.opt{display:flex; align-items:center; gap:12px; text-align:left; width:100%; background:var(--bg); border:1.5px solid var(--line); border-radius:10px; padding:11px 14px; transition:border-color .15s, background .15s}
.opt:hover:not(:disabled){border-color:var(--accent); background:var(--accent-soft)}
.opt:disabled{cursor:default}
.ltr{flex:0 0 28px; height:28px; display:grid; place-items:center; border-radius:8px; background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:.85rem}
.opt .txt{flex:1; min-width:0}
.opt .mark{font-weight:700}
.opt.ok{border-color:var(--good); background:var(--good-soft)}
.opt.ok .ltr{background:var(--good); color:var(--surface)}
.opt.ok .mark{color:var(--good)}
.opt.bad{border-color:var(--bad); background:var(--bad-soft)}
.opt.bad .ltr{background:var(--bad); color:var(--surface)}
.opt.bad .mark{color:var(--bad)}
.opt.dim{opacity:.55}
.why{margin:12px 0 0; padding:10px 12px; border-radius:10px; background:var(--accent-soft); font-size:.92rem}
.why b.good{color:var(--good)} .why b.bad{color:var(--bad)}

.foot{display:flex; align-items:center; justify-content:space-between; gap:12px 20px; flex-wrap:wrap}
.foot p{margin:0; color:var(--muted)}
.foot strong{color:var(--fg)}
.btn{background:var(--accent); color:var(--on-accent); border:0; border-radius:10px; padding:12px 20px; font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent; color:var(--fg); border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent); filter:none}

/* старт */
.hero h1{font-size:clamp(1.7rem,6vw,2.8rem); line-height:1.12; max-width:18ch}
.hero p{color:var(--muted); max-width:56ch; margin:12px 0 0}
.facts{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px}
.facts span{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:5px 11px; font-size:.86rem; font-weight:600}
label.field{display:grid; gap:6px; font-weight:700; font-size:.92rem}
input[type=text]{font:inherit; width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); color:var(--fg)}
input[type=text]::placeholder{color:var(--muted)}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:end}
.row .field{flex:1 1 240px; min-width:0}

/* сертификат */
.lock ul{margin:10px 0 14px; padding:0; list-style:none; display:grid; gap:6px}
.lock li{display:flex; justify-content:space-between; gap:12px; font-size:.95rem}
.lock li span:last-child{color:var(--muted); font-variant-numeric:tabular-nums}
.cert{position:relative; background:var(--paper); color:var(--paper-ink); border:2px solid var(--paper-gold); border-radius:6px; padding:10px; box-shadow:0 18px 40px -22px rgba(10,20,60,.45)}
.cert::before{content:""; position:absolute; inset:0; border-radius:4px; pointer-events:none;
  background:repeating-radial-gradient(circle at 100% 0, transparent 0 10px, rgba(169,130,47,.10) 10px 11px); mask-image:radial-gradient(circle at 100% 0, #000 0, transparent 55%); -webkit-mask-image:radial-gradient(circle at 100% 0, #000 0, transparent 55%)}
.cert-in{position:relative; border:1px solid var(--paper-gold); padding:clamp(22px,5vw,46px) clamp(16px,5vw,48px); text-align:center; display:grid; gap:6px; justify-items:center}
.cert-kicker{margin:0; font-size:.76rem; letter-spacing:.2em; text-transform:uppercase; color:var(--paper-gold); font-weight:700}
.cert-title{font-size:clamp(1.7rem,6vw,2.6rem); letter-spacing:.14em; text-transform:uppercase; color:var(--paper-ink); font-weight:700}
.cert-line{margin:0; color:var(--paper-muted); font-size:.95rem}
.cert-name{margin:2px 0 4px; font-family:var(--font-cert); font-style:italic; font-weight:700; font-size:clamp(2rem,8vw,3.4rem); line-height:1.1; color:var(--paper-ink); padding:0 .4em 6px; border-bottom:1px solid var(--paper-line); max-width:100%; overflow-wrap:anywhere}
.cert-score{display:flex; align-items:baseline; justify-content:center; gap:8px; margin-top:6px}
.cert-score .n{font-family:var(--font-display); font-weight:700; font-size:clamp(3rem,12vw,5rem); line-height:1; font-variant-numeric:tabular-nums}
.cert-score small{color:var(--paper-muted); font-weight:600; font-size:1rem}
.cert-level{margin:0; font-weight:700; color:var(--paper-gold); letter-spacing:.06em; text-transform:uppercase; font-size:.88rem}
.chips{display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-top:10px}
.chips span{border:1px solid var(--paper-line); border-radius:6px; padding:3px 10px; font-size:.82rem; color:var(--paper-muted); font-variant-numeric:tabular-nums}
.chips b{color:var(--paper-ink)}
.cert-foot{display:grid; grid-template-columns:1fr auto 1fr; align-items:end; gap:12px; width:100%; margin-top:22px; font-size:.8rem; color:var(--paper-muted)}
.cert-foot div{display:grid; gap:2px}
.cert-foot .l{text-align:left} .cert-foot .r{text-align:right}
.cert-foot b{color:var(--paper-ink); font-size:.9rem}
.seal{width:84px; height:84px; border-radius:50%; display:grid; place-items:center; text-align:center;
  background:radial-gradient(circle at 35% 30%, #E7C877, #A9822F 70%); color:#2B1F05; box-shadow:0 0 0 3px var(--paper), 0 0 0 4px var(--paper-gold)}
.seal b{font-family:var(--font-display); font-size:1.15rem; line-height:1; font-variant-numeric:tabular-nums}
.seal small{display:block; font-size:.58rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; margin-top:3px}
.hint{margin:0; font-size:.88rem; color:var(--muted)}
.actions{display:flex; flex-wrap:wrap; align-items:center; gap:10px 12px}
.actions .status{flex:1 1 220px; min-width:0; font-size:.88rem; color:var(--muted)}
@media (max-width:520px){
  .cert-foot{grid-template-columns:1fr 1fr}
  .cert-foot .seal{grid-column:1/-1; grid-row:1; justify-self:center}
}
@media (prefers-reduced-motion:reduce){
  .panel.enter{animation:none} .bar i,.opt{transition:none}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Тест по JavaScript<small>основы · функции · асинхронность · DOM</small></div>
    <div class="pill" aria-live="polite">Баллы <b id="score">0</b> из <span id="total">0</span></div>
  </header>
  <div class="bar" aria-hidden="true"><i id="progress"></i></div>
  <div class="tabs-wrap"><div class="tabs" id="tabs" role="tablist" aria-label="Разделы теста"></div></div>
  <main class="panel" id="panel"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ============ ВОПРОСЫ: меняйте здесь ============
   q — вопрос, o — варианты ответа, a — номер верного варианта (с нуля), e — пояснение.
   Порядок вариантов при каждом прохождении перемешивается. */
const TEST_TITLE = 'Тест по JavaScript';
const TOPICS = [
  { id:'basics', name:'Основы', note:'Типы данных, операторы и переменные.', questions:[
    { q:'Какой оператор сравнивает значения строго, без приведения типов?', o:['==','===','=','!='], a:1, e:'=== сравнивает и значение, и тип, поэтому 5 === "5" даёт false.' },
    { q:'Что вернёт typeof null?', o:['"null"','"object"','"undefined"','"number"'], a:1, e:'Это историческая особенность языка: typeof null возвращает "object".' },
    { q:'Чем const отличается от let?', o:['const нельзя переприсвоить, let можно','const работает только с числами','let нельзя менять после создания','Разницы нет'], a:0, e:'const запрещает переприсваивание, но содержимое объекта или массива изменить можно.' },
    { q:'Что получится в результате выражения "5" + 3?', o:['8','"53"','NaN','Ошибка'], a:1, e:'При сложении со строкой число превращается в строку, получается "53".' },
    { q:'Какое из значений считается истинным (truthy) в условии?', o:['0','""','[]','null'], a:2, e:'Пустой массив — это объект, а объекты в условии всегда истинны.' }
  ]},
  { id:'functions', name:'Функции', note:'Замыкания, стрелочные функции и методы массивов.', questions:[
    { q:'Что такое замыкание в JavaScript?', o:['Функция, которая помнит переменные внешней области видимости','Способ остановить выполнение программы','Вид цикла','Встроенный метод массива'], a:0, e:'Замыкание даёт функции доступ к переменным области, где она была создана.' },
    { q:'Что вернёт x => x * 2 при вызове с аргументом 4?', o:['8','4','"x * 2"','undefined'], a:0, e:'Стрелочная функция без фигурных скобок сразу возвращает результат выражения.' },
    { q:'Чем стрелочная функция отличается от обычной?', o:['У неё нет собственного this','Она всегда быстрее','Её нельзя вызвать с аргументами','Она всегда асинхронная'], a:0, e:'Стрелочная функция берёт this из внешнего контекста.' },
    { q:'Что делает метод map у массива?', o:['Создаёт новый массив из результатов функции для каждого элемента','Удаляет элементы из массива','Сортирует массив на месте','Возвращает первый подходящий элемент'], a:0, e:'map не меняет исходный массив, а возвращает новый такой же длины.' },
    { q:'Как называется функция, которую передают аргументом в другую функцию?', o:['Колбэк (callback)','Конструктор','Прототип','Геттер'], a:0, e:'Колбэк вызывается внутри другой функции, когда наступает нужный момент.' }
  ]},
  { id:'async', name:'Асинхронность', note:'Промисы, async/await и порядок выполнения.', questions:[
    { q:'Что возвращает вызов async-функции?', o:['Промис (Promise)','Строку','undefined','Число'], a:0, e:'Async-функция всегда оборачивает результат в промис.' },
    { q:'Какое ключевое слово ждёт результата промиса внутри async-функции?', o:['await','yield','pause','wait'], a:0, e:'await приостанавливает функцию, пока промис не завершится.' },
    { q:'В каком порядке выведутся числа: console.log(1); setTimeout(() => console.log(2), 0); console.log(3)?', o:['1, 3, 2','1, 2, 3','2, 1, 3','3, 2, 1'], a:0, e:'Колбэк setTimeout попадает в очередь и выполняется после всего синхронного кода.' },
    { q:'Какой метод дожидается выполнения всех промисов из массива?', o:['Promise.all','Promise.race','Promise.then','Promise.wait'], a:0, e:'Promise.all возвращает массив результатов, а при первой ошибке отклоняется.' },
    { q:'Как перехватить ошибку в коде с async/await?', o:['Блоком try...catch','Оператором switch','Методом .finish()','Никак'], a:0, e:'Ошибка отклонённого промиса при await выбрасывается как обычное исключение.' }
  ]},
  { id:'dom', name:'DOM и браузер', note:'Работа со страницей, событиями и данными.', questions:[
    { q:'Каким методом найти первый элемент по CSS-селектору?', o:['document.querySelector','document.getAll','document.findCSS','document.select'], a:0, e:'querySelector возвращает первый подходящий элемент или null.' },
    { q:'Как подписаться на клик по элементу?', o:['el.addEventListener("click", fn)','el.listen("click", fn)','el.bind("click", fn)','el.onClickOnly(fn)'], a:0, e:'addEventListener позволяет повесить несколько обработчиков на одно событие.' },
    { q:'Где можно хранить небольшие данные в браузере между сеансами?', o:['localStorage','document.cache','window.memory','sessionRAM'], a:0, e:'localStorage хранит строки, пока пользователь сам не очистит данные сайта.' },
    { q:'Что делает JSON.parse?', o:['Превращает JSON-строку в объект','Превращает объект в строку','Сортирует ключи объекта','Отправляет запрос на сервер'], a:0, e:'Обратная операция называется JSON.stringify.' },
    { q:'Что делает функция fetch?', o:['Отправляет сетевой запрос и возвращает промис','Читает файл с диска','Перезагружает страницу','Создаёт новый элемент'], a:0, e:'fetch возвращает промис с ответом сервера.' }
  ]}
];
/* ============ конец блока вопросов ============ */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LETTERS = ['А','Б','В','Г','Д'];
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let state;

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function init(keepName){
  state = {
    name: keepName ? state.name : '', tab: 'start', certNo: null, certDate: null,
    topics: TOPICS.map(t => ({ id:t.id, name:t.name, note:t.note,
      qs: t.questions.map(q => ({ q:q.q, e:q.e, pick:null, opts: shuffle(q.o.map((text,i) => ({ text, ok:i === q.a }))) })) }))
  };
}
const total = () => state.topics.reduce((n,t) => n + t.qs.length, 0);
const answeredIn = t => t.qs.filter(q => q.pick !== null).length;
const answered = () => state.topics.reduce((n,t) => n + answeredIn(t), 0);
const scoreIn = t => t.qs.filter(q => q.pick !== null && q.opts[q.pick].ok).length;
const score = () => state.topics.reduce((n,t) => n + scoreIn(t), 0);
const complete = () => answered() === total();

function renderHeader(){
  $('#score').textContent = score();
  $('#total').textContent = total();
  $('#progress').style.width = (total() ? answered() / total() * 100 : 0) + '%';
}

function renderTabs(){
  const items = [{ id:'start', label:'Старт' }]
    .concat(state.topics.map(t => ({ id:t.id, label:t.name, meta:answeredIn(t) + '/' + t.qs.length, done:answeredIn(t) === t.qs.length })))
    .concat([{ id:'cert', label:'Сертификат', locked:!complete() }]);
  $('#tabs').innerHTML = items.map(it =>
    '<button class="tab' + (it.done ? ' done' : '') + (it.locked ? ' locked' : '') + '" role="tab" data-tab="' + it.id + '" aria-selected="' + (state.tab === it.id) + '">' +
    esc(it.label) + (it.meta ? '<span class="meta">' + it.meta + '</span>' : '') + (it.locked ? '<span class="meta">закрыт</span>' : '') + '</button>'
  ).join('');
  const sel = $('#tabs [aria-selected="true"]');
  if (sel && sel.scrollIntoView) sel.scrollIntoView({ block:'nearest', inline:'nearest' });
}

function qHTML(t, ti, qi){
  const q = t.qs[qi], done = q.pick !== null;
  const opts = q.opts.map((o, oi) => {
    let cls = 'opt', mark = '';
    if (done){
      if (o.ok){ cls += ' ok'; mark = '✓'; }
      else if (q.pick === oi){ cls += ' bad'; mark = '✕'; }
      else cls += ' dim';
    }
    return '<button class="' + cls + '" data-t="' + ti + '" data-q="' + qi + '" data-o="' + oi + '"' + (done ? ' disabled' : '') + '>' +
      '<span class="ltr">' + LETTERS[oi] + '</span><span class="txt">' + esc(o.text) + '</span><span class="mark" aria-hidden="true">' + mark + '</span></button>';
  }).join('');
  let why = '';
  if (done){
    const right = q.opts[q.pick].ok;
    why = '<p class="why">' + (right ? '<b class="good">Верно.</b> ' : '<b class="bad">Неверно.</b> Правильный ответ: ' + esc(q.opts.find(o => o.ok).text) + '. ') + esc(q.e) + '</p>';
  }
  return '<section class="card"><p class="q-num">Вопрос ' + (qi + 1) + ' из ' + t.qs.length + '</p><p class="q-text">' + esc(q.q) + '</p><div class="opts">' + opts + '</div>' + why + '</section>';
}

function nextTarget(ti){
  const n = state.topics.length;
  for (let k = 1; k <= n; k++){
    const j = (ti + k) % n;
    if (answeredIn(state.topics[j]) < state.topics[j].qs.length) return state.topics[j].id;
  }
  return 'cert';
}

function startHTML(){
  return '<section class="hero"><p class="eyebrow">' + esc(TEST_TITLE) + '</p><h1>Проверьте, как вы знаете JavaScript</h1>' +
    '<p>Откройте любую тему на вкладках выше и отвечайте на вопросы. После каждого ответа появится пояснение. В конце вы получите сертификат с вашим результатом.</p>' +
    '<div class="facts"><span>' + state.topics.length + ' темы</span><span>' + total() + ' вопросов</span><span>1 балл за верный ответ</span></div></section>' +
    '<section class="card"><div class="row"><label class="field" for="name">Ваше имя для сертификата<input type="text" id="name" maxlength="60" placeholder="Например, Алишер Каримов" autocomplete="name" value="' + esc(state.name) + '"></label>' +
    '<button class="btn" data-go="' + state.topics[0].id + '">Начать тест</button></div></section>';
}

function topicHTML(ti){
  const t = state.topics[ti], all = answeredIn(t) === t.qs.length;
  let h = '<section class="head"><p class="eyebrow">Тема ' + (ti + 1) + ' из ' + state.topics.length + '</p><h2>' + esc(t.name) + '</h2><p class="note">' + esc(t.note) + '</p></section>';
  h += t.qs.map((_, qi) => qHTML(t, ti, qi)).join('');
  if (all){
    const nt = nextTarget(ti);
    h += '<div class="foot card"><p>Результат по теме: <strong>' + scoreIn(t) + ' из ' + t.qs.length + '</strong></p><button class="btn" data-go="' + nt + '">' +
      (nt === 'cert' ? 'Получить сертификат' : 'Следующая тема') + '</button></div>';
  }
  return h;
}

function levelOf(p){ return p >= 90 ? 'Отлично' : p >= 70 ? 'Хорошо' : p >= 50 ? 'Удовлетворительно' : 'Участие'; }

function certHTML(){
  if (!complete()){
    const rows = state.topics.map(t => '<li><span>' + esc(t.name) + '</span><span>' + answeredIn(t) + ' из ' + t.qs.length + '</span></li>').join('');
    return '<section class="head"><p class="eyebrow">Финал</p><h2>Сертификат пока закрыт</h2><p class="note">Он откроется, когда вы ответите на все вопросы. Осталось ответить на ' + (total() - answered()) + '.</p></section>' +
      '<section class="card lock"><ul>' + rows + '</ul><button class="btn" data-go="' + nextTarget(-1) + '">Продолжить тест</button></section>';
  }
  if (!state.certNo){
    state.certNo = String(Date.now()).slice(-6);
    state.certDate = new Date().toLocaleDateString('ru-RU', { day:'numeric', month:'long', year:'numeric' });
  }
  const s = score(), tt = total(), p = Math.round(s / tt * 100);
  const chips = state.topics.map(t => '<span>' + esc(t.name) + ' <b>' + scoreIn(t) + '/' + t.qs.length + '</b></span>').join('');
  return '<section class="head"><p class="eyebrow">Финал</p><h2>Ваш результат</h2></section>' +
    '<section class="card"><div class="row"><label class="field" for="certInput">Имя на сертификате<input type="text" id="certInput" maxlength="60" placeholder="Введите ваше имя" value="' + esc(state.name) + '"></label>' +
    '<button class="btn ghost" data-retake="1">Пройти заново</button></div></section>' +
    '<article class="cert" id="cert"><div class="cert-in">' +
      '<p class="cert-kicker">' + esc(TEST_TITLE) + '</p><h2 class="cert-title">Сертификат</h2>' +
      '<p class="cert-line">подтверждает, что</p>' +
      '<p class="cert-name" id="certName">' + esc(state.name || 'Ваше имя') + '</p>' +
      '<p class="cert-line">успешно завершил(а) тест и набрал(а)</p>' +
      '<div class="cert-score"><span class="n" id="count" data-to="' + s + '">' + (reduce ? s : 0) + '</span><small>из ' + tt + ' баллов</small></div>' +
      '<p class="cert-level">' + levelOf(p) + ' · ' + p + '%</p><div class="chips">' + chips + '</div>' +
      '<div class="cert-foot"><div class="l"><span>Дата</span><b>' + esc(state.certDate) + '</b></div>' +
      '<div class="seal"><div><b>' + p + '%</b><small>результат</small></div></div>' +
      '<div class="r"><span>Номер</span><b>№ ' + state.certNo + '</b></div></div>' +
    '</div></article>' +
    '<div class="actions" id="actions" hidden><button class="btn" data-dl="png">Скачать PNG</button><button class="btn ghost" data-dl="pdf">Скачать PDF</button><span class="status" id="dlStatus" role="status" aria-live="polite"></span></div>' +
    '<p class="hint" id="hint">Чтобы сохранить сертификат, сделайте скриншот.</p>';
}

function renderPanel(){
  const panel = $('#panel');
  let html;
  if (state.tab === 'start') html = startHTML();
  else if (state.tab === 'cert') html = certHTML();
  else html = topicHTML(state.topics.findIndex(t => t.id === state.tab));
  panel.innerHTML = html;
  if (state.tab === 'cert' && complete()){ countUp(); applyActions(); }
}

function countUp(){
  const el = $('#count'); if (!el || reduce) return;
  const to = +el.dataset.to, t0 = performance.now(), dur = 900;
  (function step(now){
    const k = Math.min(1, (now - t0) / dur);
    el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

function switchTab(id){
  state.tab = id;
  renderHeader(); renderTabs(); renderPanel();
  const p = $('#panel'); p.classList.remove('enter'); void p.offsetWidth; p.classList.add('enter');
  window.scrollTo(0, 0);
}

function answer(ti, qi, oi){
  const q = state.topics[ti].qs[qi];
  if (q.pick !== null) return;
  q.pick = oi;
  const y = window.scrollY;
  renderHeader(); renderTabs(); renderPanel();
  window.scrollTo(0, y);
}

$('#panel').addEventListener('click', e => {
  const opt = e.target.closest('.opt');
  if (opt && !opt.disabled){ answer(+opt.dataset.t, +opt.dataset.q, +opt.dataset.o); return; }
  const dlBtn = e.target.closest('[data-dl]');
  if (dlBtn){ downloadCert(dlBtn.dataset.dl); return; }
  const go = e.target.closest('[data-go]');
  if (go){ switchTab(go.dataset.go); return; }
  if (e.target.closest('[data-retake]')){ init(true); renderHeader(); renderTabs(); switchTab('start'); }
});
$('#panel').addEventListener('input', e => {
  if (e.target.id === 'name' || e.target.id === 'certInput'){
    state.name = e.target.value.trim();
    const n = $('#certName'); if (n) n.textContent = state.name || 'Ваше имя';
  }
});
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (b) switchTab(b.dataset.tab);
});

/* ============ скачивание сертификата ============ */
let dl = null;
function applyActions(){
  const a = $('#actions'), h = $('#hint');
  if (dl && a){ a.hidden = false; if (h) h.hidden = true; }
}
function setStatus(t){ const s = $('#dlStatus'); if (s) s.textContent = t; }

async function drawCert(){
  const W = 1600, H = 1131, s = score(), tt = total(), p = Math.round(s / tt * 100);
  const ink = '#14224F', muted = '#5E6786', gold = '#A9822F', line = '#DCD6C3', paper = '#FBFBF8';
  const CY = 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюя0123456789%№·()/ ';
  const name = state.name || 'Ваше имя';
  try {
    await Promise.all([
      document.fonts.load('italic 700 120px "Cormorant Garamond"', name + CY),
      document.fonts.load('700 80px Unbounded', CY),
      document.fonts.load('400 28px Manrope', CY),
      document.fonts.load('700 28px Manrope', CY)
    ]);
  } catch (_) {}
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const hasLS = 'letterSpacing' in x;
  const T = (t, px, py, font, col, ls, al) => {
    x.font = font; x.fillStyle = col; x.textAlign = al || 'center'; x.textBaseline = 'alphabetic';
    if (hasLS) x.letterSpacing = (ls || 0) + 'px';
    x.fillText(t, px, py);
    if (hasLS) x.letterSpacing = '0px';
  };
  const rr = (px, py, w, h, r) => {
    x.beginPath(); x.moveTo(px + r, py); x.arcTo(px + w, py, px + w, py + h, r); x.arcTo(px + w, py + h, px, py + h, r);
    x.arcTo(px, py + h, px, py, r); x.arcTo(px, py, px + w, py, r); x.closePath();
  };
  x.fillStyle = paper; x.fillRect(0, 0, W, H);
  /* узор в углах */
  x.save(); x.beginPath(); x.rect(44, 44, W - 88, H - 88); x.clip();
  [[W - 44, 44], [44, H - 44]].forEach(([cx, cy]) => {
    for (let r = 14; r <= 420; r += 14){
      x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.strokeStyle = gold; x.globalAlpha = 0.16 * (1 - r / 440); x.lineWidth = 1.5; x.stroke();
    }
  });
  x.restore();
  x.strokeStyle = gold; x.lineWidth = 6; x.strokeRect(22, 22, W - 44, H - 44);
  x.lineWidth = 1.5; x.strokeRect(44, 44, W - 88, H - 88);

  T(TEST_TITLE.toUpperCase(), W / 2, 140, '700 22px Manrope, sans-serif', gold, 6);
  T('СЕРТИФИКАТ', W / 2, 250, '700 84px Unbounded, Manrope, sans-serif', ink, 10);
  T('подтверждает, что', W / 2, 320, '400 28px Manrope, sans-serif', muted, 0);

  let size = 130;
  x.font = 'italic 700 ' + size + 'px "Cormorant Garamond", serif';
  while (x.measureText(name).width > W - 340 && size > 48){ size -= 4; x.font = 'italic 700 ' + size + 'px "Cormorant Garamond", serif'; }
  const nw = x.measureText(name).width;
  T(name, W / 2, 450, 'italic 700 ' + size + 'px "Cormorant Garamond", serif', ink, 0);
  const half = Math.max(nw / 2 + 30, 260);
  x.strokeStyle = line; x.lineWidth = 2; x.beginPath(); x.moveTo(W / 2 - half, 480); x.lineTo(W / 2 + half, 480); x.stroke();

  T('успешно завершил(а) тест и набрал(а)', W / 2, 545, '400 28px Manrope, sans-serif', muted, 0);

  const numFont = '700 150px Unbounded, Manrope, sans-serif', smallFont = '700 34px Manrope, sans-serif';
  x.font = numFont; const w1 = x.measureText(String(s)).width;
  const small = 'из ' + tt + ' баллов';
  x.font = smallFont; const w2 = x.measureText(small).width;
  const x0 = W / 2 - (w1 + 20 + w2) / 2;
  T(String(s), x0, 700, numFont, ink, 0, 'left');
  T(small, x0 + w1 + 20, 700, smallFont, muted, 0, 'left');

  T((levelOf(p) + ' · ' + p + '%').toUpperCase(), W / 2, 770, '700 30px Manrope, sans-serif', gold, 3);

  const chipFont = '700 24px Manrope, sans-serif';
  const labels = state.topics.map(t => t.name + '  ' + scoreIn(t) + '/' + t.qs.length);
  x.font = chipFont;
  const ws = labels.map(l => x.measureText(l).width + 40), gap = 16;
  let cx0 = W / 2 - (ws.reduce((a, b) => a + b, 0) + gap * (ws.length - 1)) / 2;
  labels.forEach((l, i) => {
    rr(cx0, 810, ws[i], 48, 8); x.strokeStyle = line; x.lineWidth = 2; x.stroke();
    T(l, cx0 + ws[i] / 2, 842, chipFont, muted, 0);
    cx0 += ws[i] + gap;
  });

  T('Дата', 140, 960, '400 22px Manrope, sans-serif', muted, 0, 'left');
  T(state.certDate || '', 140, 1005, '700 28px Manrope, sans-serif', ink, 0, 'left');
  T('Номер', W - 140, 960, '400 22px Manrope, sans-serif', muted, 0, 'right');
  T('№ ' + (state.certNo || ''), W - 140, 1005, '700 28px Manrope, sans-serif', ink, 0, 'right');

  const sy = 985, g = x.createRadialGradient(W / 2 - 20, sy - 24, 6, W / 2, sy, 70);
  g.addColorStop(0, '#E7C877'); g.addColorStop(1, gold);
  x.beginPath(); x.arc(W / 2, sy, 70, 0, Math.PI * 2); x.fillStyle = g; x.fill();
  x.beginPath(); x.arc(W / 2, sy, 76, 0, Math.PI * 2); x.strokeStyle = gold; x.lineWidth = 2; x.stroke();
  x.beginPath(); x.arc(W / 2, sy, 73, 0, Math.PI * 2); x.strokeStyle = paper; x.lineWidth = 4; x.stroke();
  T(p + '%', W / 2, sy + 6, '700 34px Unbounded, Manrope, sans-serif', '#2B1F05', 0);
  T('РЕЗУЛЬТАТ', W / 2, sy + 30, '700 13px Manrope, sans-serif', '#2B1F05', 2);
  return c;
}

async function downloadCert(kind){
  if (!dl) return;
  if (!state.name){
    setStatus('Введите имя выше, чтобы оно появилось на сертификате.');
    const i = $('#certInput'); if (i) i.focus();
    return;
  }
  try {
    setStatus('Готовлю файл…');
    const canvas = await drawCert();
    const safe = state.name.replace(/[\\/:*?"<>|]+/g, ' ').trim() || 'Сертификат';
    if (kind === 'pdf'){
      if (!window.jspdf){ setStatus('PDF сейчас недоступен, скачайте PNG.'); return; }
      const W = canvas.width, H = canvas.height;
      const pdf = new window.jspdf.jsPDF({ orientation:'landscape', unit:'px', format:[W, H], hotfixes:['px_scaling'] });
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, W, H);
      await dl.save({ filename:'Сертификат - ' + safe + '.pdf', data:pdf.output('blob') });
    } else {
      const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
      await dl.save({ filename:'Сертификат - ' + safe + '.png', data:blob });
    }
    setStatus('Файл сохранён.');
  } catch (err){
    setStatus(err && err.code === 'declined' ? 'Сохранение отменено.' : 'Не удалось сохранить файл в этом окне. Сделайте скриншот.');
  }
}

(async () => {
  try { dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; } catch (_) { dl = null; }
  if (state.tab === 'cert') applyActions();
})();

init(false); renderHeader(); renderTabs(); renderPanel();
</script>

</body></html>
